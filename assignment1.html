
<!DOCTYPE html>
<html>
<head>
    <title>Concentric Circles</title>

    <style>
        .container {
            width: 100px;
            height: 100px;
            position: relative;
            margin: 50px;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid black;
            box-sizing: border-box;
        }

        /* Outer Circle */
        .circle1 {
            width: 60px;
            height: 60px;
            background-color: lightpink;
            top: 0;
            left: 0;
        }

        /* Middle Circle */
        .circle2 {
            width: 40px;
            height: 40px;
            background-color: lightyellow;
            top: 10px;
            left: 10px;
        }

        /* Inner Circle */
        .circle3 {
            width: 20px;
            height: 20px;
            background-color: lightblue;
            top: 20px;
            left: 20px;
        }
    </style>
</head>

<body>
    <h2>Three Concentric Circles</h2>

    <div class="container">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
    </div>

</body>
</html>
